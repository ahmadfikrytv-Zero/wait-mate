<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wait-mate — delightful waiting animations</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    background:#0f1115; color:#f4f4f5; font-family:system-ui,sans-serif; }
  h1 { font-size:22px; margin:0; }
  p  { color:#9aa0aa; margin:0; max-width:520px; text-align:center; line-height:1.5; }
  button { background:#8ab4ff; color:#0f1115; border:0; border-radius:8px;
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  code { background:#1b1e24; padding:2px 6px; border-radius:4px; font-size:13px; }
  select { background:#1b1e24; color:#f4f4f5; border:1px solid #2a2d33;
    border-radius:6px; padding:6px 10px; }
</style>
</head>
<body>
  <h1>⏳ wait-mate</h1>
  <p>Tiny delightful animations that keep you company while a long-running
     task finishes in the background. Pick a scene, hit the button, and
     enjoy the theatrics while a fake async job runs.</p>
  <div style="display:flex;gap:10px;align-items:center;">
    <select id="scene">
      <option value="walker">🚶 walker</option>
      <option value="dots">🔵 dots</option>
      <option value="orbit">🪐 orbit</option>
      <option value="meter">📊 meter</option>
      <option value="sleepy">😴 sleepy</option>
    </select>
    <button id="go">Run a 6-second job</button>
  </div>
  <p><code>WaitMate.start(job, { scene: 'walker' })</code></p>

<script type="module">
  import { WaitMate } from './src/waitmate.js';

  document.getElementById('go').addEventListener('click', async () => {
    const scene = document.getElementById('scene').value;
    const job = new Promise(res => setTimeout(res, 6000));
    await WaitMate.start(job, { scene, message: 'Brewing something good…' });
  });
</script>
</body>
</html>
